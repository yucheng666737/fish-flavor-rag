<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康生活體驗 - 歡迎頁面</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/rag.css">
</head>
<body class="welcome-page">
    <aside class="rag-banner"><a href="rag.html">風味知識問答</a> · 風味設計展示，非營養檢測或醫療建議。</aside>
    <!-- 背景动画元素 -->
    <div class="animated-bg">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>
    
    <!-- 玻璃态设计的主要内容 -->
    <div class="welcome-content glass-effect">
        <div class="welcome-header">
            <h1 class="main-title">鱸魚精風味設計體驗</h1>
            <p class="subtitle">探索屬於您的專屬風味配方</p>
        </div>
        
        <!-- 特色区块 -->
        <div class="feature-grid">
            <div class="feature-item glass-card">
                <div class="feature-icon">
                    <i class="fas fa-fish"></i>
                </div>
                <h3>天然成分</h3>
                <p>精選優質鱸魚原料，為您的健康把關</p>
            </div>
            <div class="feature-item glass-card">
                <div class="feature-icon">
                    <i class="fas fa-wand-magic-sparkles"></i>
                </div>
                <h3>個人化設計</h3>
                <p>依據您的偏好與需求，打造專屬方案</p>
            </div>
            <div class="feature-item glass-card">
                <div class="feature-icon">
                    <i class="fas fa-file-lines"></i>
                </div>
                <h3>風味設計報告</h3>
                <p>自動生成專屬配方報告，打造專屬於你的風味</p>
            </div>
        </div>
        
        <!-- 开始按钮 -->
        <div class="cta-section">
            <a href="identity.html" class="btn-primary btn-start">開始體驗</a>
            <div class="scroll-indicator">
                <span>向下滾動瞭解更多</span>
                <div class="scroll-arrow"></div>
            </div>
        </div>
    </div>
    
    <!-- 装饰元素 -->
    <div class="decorative-elements">
        <div class="leaf-decoration left"></div>
        <div class="leaf-decoration right"></div>
        <div class="water-drop"></div>
    </div>
    
    <script src="js/welcome.js"></script>
</body>
</html>
